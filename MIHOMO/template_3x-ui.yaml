# ==============================================================================
# 🚀 Шаблон подписки Mihomo (Clash.Meta) для панели 3x-ui
# Оптимизированная маршрутизация: игры, гос. сервисы и банки идут напрямую;
# внешние медиа, Discord и AI — через удаленный узел.
# ==============================================================================

proxy-groups:
  - name: 🛡️ Прокси-узел
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hijacking.png
    type: select
    proxies:
      - ⚡️ Авто-выбор
    include-all: true
    url: https://www.gstatic.com/generate_204

  - name: 📺 Youtube
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png
    type: select
    include-all: true
    proxies:
      - 🛡️ Прокси-узел

  - name: 💬 Discord
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Discord.png
    type: select
    include-all: true
    proxies:
      - 🛡️ Прокси-узел

  - name: 🎮 Игры
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Game.png
    type: select
    include-all: true
    proxies:
      - 🔓 Прямое соединение
      - 🛡️ Прокси-узел

  - name: ⚡️ Авто-выбор
    type: url-test
    tolerance: 150
    url: https://www.gstatic.com/generate_204
    interval: 300
    include-all: true
    hidden: true

  - name: PROXY
    type: select
    hidden: true
    proxies:
      - 🛡️ Прокси-узел

  - name: 🔓 Прямое соединение
    type: select
    hidden: true
    proxies:
      - DIRECT

  - name: 🛑 Блокировка рекламы
    type: select
    hidden: true
    proxies:
      - REJECT

