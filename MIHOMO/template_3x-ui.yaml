rules:
  # Системные и локальные сети
  - RULE-SET,private-ips,DIRECT,no-resolve
  - IP-CIDR,::/0,REJECT-DROP,no-resolve
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT-DROP
  - RULE-SET,private-domains,DIRECT

  # Блокировка рекламы и спама
  - RULE-SET,category-ads,🛑 Блокировка рекламы
  - RULE-SET,win-spy,🛑 Блокировка рекламы

  # P2P и торренты — напрямую
  - RULE-SET,torrent-domains,DIRECT
  - RULE-SET,torrent-clients,DIRECT

  # Сетевые службы и медиа
  - RULE-SET,google-play,PROXY
  - RULE-SET,twitch-ads,PROXY
  - RULE-SET,youtube,📺 Youtube
  - RULE-SET,telegram,PROXY
  - RULE-SET,telegram-ip,PROXY,no-resolve
  - RULE-SET,discord,💬 Discord
  - RULE-SET,discord-ip,PROXY,no-resolve
  - RULE-SET,ai,PROXY
  - RULE-SET,category-geoblock-ru,PROXY
  - RULE-SET,github,PROXY

  # Игры — напрямую с низким RTT
  - RULE-SET,epicgames,🎮 Игры
  - RULE-SET,origin,🎮 Игры
  - RULE-SET,riot,🎮 Игры
  - RULE-SET,escapefromtarkov,🎮 Игры
  - RULE-SET,steam,🎮 Игры
  - RULE-SET,faceit,🎮 Игры
  - RULE-SET,games,🎮 Игры

  # Локальные сервисы и доверенная инфраструктура
  - RULE-SET,twitch,DIRECT
  - RULE-SET,microsoft,DIRECT
  - RULE-SET,apple,DIRECT
  - RULE-SET,pinterest,DIRECT
  - RULE-SET,category-ru,DIRECT
  - RULE-SET,whitelist,DIRECT
  - RULE-SET,ru-apps,DIRECT
  - RULE-SET,direct-ips,DIRECT

  # Остальной международный трафик
  - MATCH,PROXY
