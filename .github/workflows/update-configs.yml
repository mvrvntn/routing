name: Build & Update Routing

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "geoip/**"
      - "HAPP/**"
      - "INCY/**"
      - "MIHOMO/**"
      - ".github/workflows/update-configs.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build Geodata & Routing Configs
    runs-on: ubuntu-latest
    env:
      CURL: "curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused"

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Generate build tag
        run: |
          DAILY_TAG=$(date -u +%Y%m%d%H%M)
          echo "DAILY_TAG=$DAILY_TAG" >> "$GITHUB_ENV"

      # --- 1. BUILD GEOSITE.DAT ---
      - name: Checkout geosite builder
        uses: actions/checkout@v4
        with:
          repository: v2fly/domain-list-community
          path: community
          fetch-depth: 1

      - name: Build geosite.dat
        run: |
          set -euo pipefail
          rm -rf community/data /tmp/geosite_out
          mkdir -p community/data /tmp/geosite_out

          cp -a ./data/. community/data/

          pushd community >/dev/null
          go run ./ -outputdir=/tmp/geosite_out
          popd >/dev/null

          test -s /tmp/geosite_out/dlc.dat
          cp -f /tmp/geosite_out/dlc.dat ./geosite.dat

      # --- 2. BUILD GEOIP.DAT ---
      - name: Checkout geoip builder
        uses: actions/checkout@v4
        with:
          repository: Loyalsoldier/geoip
          path: geoip_src
          fetch-depth: 1

      - name: Overlay custom files over geoip
        run: |
          set -euo pipefail
          cp -f ./geoip/*.json geoip_src/ 2>/dev/null || true
          cp -f ./geoip/*.txt  geoip_src/ 2>/dev/null || true
          cp -f ./geoip/*.py   geoip_src/ 2>/dev/null || true

      - name: Download IP lists and Geobases
        working-directory: geoip_src
        run: |
          set -euo pipefail
          mkdir -p geolite2

          ${{ env.CURL }} -o whitelist.txt https://raw.githubusercontent.com/escapingworm/russia-whitelist/refs/heads/main/ru-whitelist-cidr.txt || touch whitelist.txt
          ${{ env.CURL }} -o antifilterdownloadcommunity.txt https://community.antifilter.download/list/community.lst || touch antifilterdownloadcommunity.txt
          ${{ env.CURL }} -o refilter.txt https://raw.githubusercontent.com/1andrevich/Re-filter-lists/refs/heads/main/ipsum.lst || touch refilter.txt
          ${{ env.CURL }} -o refiltercommunity.txt https://raw.githubusercontent.com/1andrevich/Re-filter-lists/refs/heads/main/community_ips.lst || touch refiltercommunity.txt
          ${{ env.CURL }} -o antifilternetwork.txt https://antifilter.network/download/ip.lst || touch antifilternetwork.txt
          ${{ env.CURL }} -o cdn.lst https://raw.githubusercontent.com/mansourjabin/cdn-ip-database/refs/heads/main/data/cdn.lst || touch cdn.lst
          ${{ env.CURL }} -o merged.sum https://raw.githubusercontent.com/PentiumB/CDN-RuleSet/refs/heads/main/release/merged.sum || touch merged.sum

          ${{ env.CURL }} -o geolite_ru.lst https://raw.githubusercontent.com/hydraponique/countrydb/refs/heads/main/output/geolite2-geo-whois-asn-country-ipv4/ru.lst || touch geolite_ru.lst
          ${{ env.CURL }} -o geolite_by.lst https://raw.githubusercontent.com/hydraponique/countrydb/refs/heads/main/output/geolite2-geo-whois-asn-country-ipv4/by.lst || touch geolite_by.lst
          ${{ env.CURL }} -o ipinfo_ru.lst https://raw.githubusercontent.com/Davoyan/ipinfo/refs/heads/main/geo/geoip/ru.lst || touch ipinfo_ru.lst
          ${{ env.CURL }} -o ipinfo_by.lst https://raw.githubusercontent.com/Davoyan/ipinfo/refs/heads/main/geo/geoip/by.lst || touch ipinfo_by.lst
          ${{ env.CURL }} -o dbip_ru.lst https://raw.githubusercontent.com/hydraponique/countrydb/refs/heads/main/output/dbip-country-ipv4/ru.lst || touch dbip_ru.lst
          ${{ env.CURL }} -o dbip_by.lst https://raw.githubusercontent.com/hydraponique/countrydb/refs/heads/main/output/dbip-country-ipv4/by.lst || touch dbip_by.lst

          ${{ env.CURL }} -o /tmp/GeoLite2-ASN-CSV.zip https://dl.netsyms.net/dbs/geolite2/GeoLite2-ASN-CSV.zip || true
          if [ -f /tmp/GeoLite2-ASN-CSV.zip ]; then
            unzip -o -j /tmp/GeoLite2-ASN-CSV.zip '*/GeoLite2-ASN-Blocks-*.csv' -d ./geolite2 || true
          fi

      - name: Build geoip.dat
        working-directory: geoip_src
        run: |
          set -euo pipefail
          go mod download
          go build -o geoip_builder
          rm -rf output
          ./geoip_builder convert -c config.json
          test -s output/dat/geoip.dat
          cp -f output/dat/geoip.dat ../geoip.dat

      # --- 3. CONVERT RULESETS (MIHOMO & SING-BOX) ---
      - name: Install Mihomo & sing-box
        run: |
          set -euo pipefail
          ARCH=$(dpkg --print-architecture)
          LATEST_URL=$(${{ env.CURL }} https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | grep -oP '"browser_download_url":\s*"\K[^"]*mihomo-linux-'"$ARCH"'-[^"]*\.deb(?=")' \
            | head -n1 || true)
          if [ -n "$LATEST_URL" ]; then
            ${{ env.CURL }} -o /tmp/mihomo.deb "$LATEST_URL"
            sudo dpkg -i /tmp/mihomo.deb || sudo apt-get install -f -y
            rm -f /tmp/mihomo.deb
          fi

          ${{ env.CURL }} https://sing-box.app/install.sh | sudo -E sh -s -- --version 1.12.12 || true

      - name: Build .mrs & .srs
        run: |
          set -euo pipefail
          mkdir -p /tmp/mihomo_rules /tmp/singbox_rules

          if command -v mihomo &>/dev/null; then
            for f in ./data/*; do
              [ -f "$f" ] || continue
              name=$(basename "$f")
              tmp="$(mktemp)"
              awk '
                function trim(s){ sub(/^[ \t]+/,"",s); sub(/[ \t]+$/,"",s); return s }
                {
                  gsub(/\r/,"")
                  s=trim($0)
                  sub(/[ \t]*#.*/, "", s)
                  if (s ~ /^full:/) { sub(/^full:/, "", s); if (s != "") print s; next }
                  if (s ~ /^domain:/) { sub(/^domain:/, "", s); sub(/^\./, "", s); if (s != "") print "+." s; next }
                  if (s ~ /^keyword:/) { sub(/^keyword:/, "", s); sub(/^\./, "", s); if (s != "") print "+." s ".*"; next }
                  if (s != "" && s !~ /^[a-z0-9_-]+:/) { sub(/^\./, "", s); print "+." s }
                }
              ' "$f" > "$tmp"
              mihomo convert-ruleset domain text "$tmp" "/tmp/mihomo_rules/${name}.mrs" 2>/dev/null || true
              rm -f "$tmp"
            done
          fi

          if command -v sing-box &>/dev/null; then
            for f in ./data/*; do
              [ -f "$f" ] || continue
              name=$(basename "$f")
              tmp_json="$(mktemp)"
              awk '
                function trim(s){ sub(/^[ \t]+/,"",s); sub(/[ \t]+$/,"",s); return s }
                {
                  gsub(/\r/,"")
                  s=trim($0)
                  sub(/[ \t]*#.*/, "", s)
                  if (s ~ /^full:/)   { v=trim(substr(s,6)); sub(/^\./,"",v); if(v!="") print "domain\t"  v; next }
                  if (s ~ /^domain:/) { v=trim(substr(s,8)); sub(/^\./,"",v); if(v!="") print "suffix\t"  v; next }
                  if (s ~ /^keyword:/){ v=trim(substr(s,9));                   if(v!="") print "keyword\t" v; next }
                  if (s ~ /^regexp:/) { v=trim(substr(s,8));                   if(v!="") print "regex\t"   v; next }
                  if (s != "" && s !~ /^[a-z0-9_-]+:/) { sub(/^\./,"",s); print "suffix\t" s }
                }
              ' "$f" | jq -Rn '
                def add($k; $v): .rules[0][$k] = ((.rules[0][$k] // []) + [$v]);
                reduce (inputs | split("\t")) as $it ({"version":3,"rules":[{}]};
                  if   $it[0]=="domain"  then add("domain";         $it[1])
                  elif $it[0]=="suffix"  then add("domain_suffix";  $it[1])
                  elif $it[0]=="keyword" then add("domain_keyword"; $it[1])
                  elif $it[0]=="regex"   then add("domain_regex";   $it[1])
                  else . end
                )
                | .rules[0] |= with_entries(select(.value | length > 0))
                | if (.rules[0] | length) == 0 then .rules = [] else . end
              ' > "$tmp_json"
              sing-box rule-set compile --output "/tmp/singbox_rules/${name}.srs" "$tmp_json" 2>/dev/null || true
              rm -f "$tmp_json"
            done
          fi

      # --- 4. PREPARE RELEASE DIR & PACKAGES ---
      - name: Prepare release files
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/mihomo release/sing-box release/text

          cp -f geosite.dat release/
          cp -f geoip.dat release/
          sha256sum release/geosite.dat | awk '{print $1}' > release/geosite.dat.sha256
          sha256sum release/geoip.dat | awk '{print $1}' > release/geoip.dat.sha256

          if [ -d /tmp/mihomo_rules ]; then
            cp -a /tmp/mihomo_rules/. release/mihomo/ 2>/dev/null || true
            if [ -d geoip_src/output/mrs ]; then
              cp -a geoip_src/output/mrs/. release/mihomo/ 2>/dev/null || true
            fi
            tar -czf release/mihomo.tar.gz -C release mihomo
          fi

          if [ -d /tmp/singbox_rules ]; then
            cp -a /tmp/singbox_rules/. release/sing-box/ 2>/dev/null || true
            if [ -d geoip_src/output/srs ]; then
              cp -a geoip_src/output/srs/. release/sing-box/ 2>/dev/null || true
            fi
            tar -czf release/sing-box.tar.gz -C release sing-box
          fi

          if [ -d geoip_src/output/text ]; then
            cp -a geoip_src/output/text/. release/text/ 2>/dev/null || true
            tar -czf release/text.tar.gz -C release text
          fi

      # --- 5. UPDATE HAPP & INCY MANIFESTS ---
      - name: Update HAPP and INCY manifests & Deeplinks
        run: |
          set -euo pipefail
          now_epoch="$(date -u +%s)"
          geoip_url="https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ env.DAILY_TAG }}/release/geoip.dat"
          geosite_url="https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ env.DAILY_TAG }}/release/geosite.dat"

          update_json_and_deeplink() {
            local folder="$1"
            local name="$2"
            local json_file="${folder}/${name}.JSON"
            local deeplink_file="${folder}/${name}.DEEPLINK"
            local scheme="$(echo "$folder" | tr '[:upper:]' '[:lower:]')"

            local tmp="$(mktemp)"
            jq \
              --arg ts "$now_epoch" \
              --arg geoip "$geoip_url" \
              --arg geosite "$geosite_url" \
              '.LastUpdated = $ts | .Geoipurl = $geoip | .Geositeurl = $geosite' \
              "$json_file" > "$tmp"
            mv "$tmp" "$json_file"

            local b64="$(jq -c . "$json_file" | base64 -w 0)"
            printf '%s://routing/onadd/%s\n' "$scheme" "$b64" > "$deeplink_file"

            if [ "$folder" = "INCY" ]; then
              local autorouting_file="${folder}/${name}.AUTOROUTING"
              printf 'incy://autorouting/onadd/https://raw.githubusercontent.com/%s/refs/heads/main/INCY/%s.JSON\n' "${{ github.repository }}" "$name" > "$autorouting_file"
            fi
          }

          update_json_and_deeplink "HAPP" "DEFAULT"
          update_json_and_deeplink "HAPP" "WHITELIST"
          update_json_and_deeplink "HAPP" "JSONSUB"

          update_json_and_deeplink "INCY" "DEFAULT"
          update_json_and_deeplink "INCY" "WHITELIST"
          update_json_and_deeplink "INCY" "JSONSUB"

      # --- 6. PUSH RELEASE BRANCH & PUBLISH GITHUB RELEASE ---
      - name: Push to release branch
        run: |
          set -euo pipefail
          cd release
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add -A
          git commit -m "Release ${{ env.DAILY_TAG }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u origin release
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.DAILY_TAG }}
          name: "Routing Release ${{ env.DAILY_TAG }}"
          prerelease: false
          draft: false
          files: |
            release/*.dat
            release/*.dat.sha256
            release/*.tar.gz

      # --- 7. COMMIT UPDATED MANIFESTS TO MAIN ---
      - name: Commit and push changes to main
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HAPP/ INCY/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update routing configs and deeplinks ${{ env.DAILY_TAG }} [skip ci]"
            git push origin main
          fi

      # --- 8. PURGE CDN CACHE ---
      - name: Purge jsDelivr CDN
        run: |
          set -euo pipefail
          ${{ env.CURL }} -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/geosite.dat" || true
          ${{ env.CURL }} -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/geoip.dat" || true
          ${{ env.CURL }} -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/geosite.dat.sha256" || true
          ${{ env.CURL }} -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/geoip.dat.sha256" || true
          ${{ env.CURL }} -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@${{ env.DAILY_TAG }}/release/geosite.dat" || true
          ${{ env.CURL }} -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@${{ env.DAILY_TAG }}/release/geoip.dat" || true

      # --- 9. OPTIONAL DEPLOY TO SERVERS ---
      - name: Deploy to servers (if configured)
        if: env.DEPLOY_SERVERS != '' && env.DEPLOY_SSH_KEY != ''
        env:
          DEPLOY_SERVERS: ${{ secrets.DEPLOY_SERVERS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          HAPP_DEFAULT="$(tr -d '\n\r' < HAPP/DEFAULT.DEEPLINK)"
          INCY_DEFAULT="$(tr -d '\n\r' < INCY/DEFAULT.DEEPLINK)"

          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/deploy_key"

          IFS=',' read -ra SERVERS <<< "$DEPLOY_SERVERS"
          for SERVER in "${SERVERS[@]}"; do
            SRV=$(echo "$SERVER" | xargs)
            [ -n "$SRV" ] || continue
            echo "Updating node on $SRV..."
            ssh $SSH_OPTS "$SRV" bash -s -- "$HAPP_DEFAULT" "$INCY_DEFAULT" <<'REMOTE_SCRIPT' || true
              set -e
              # Update remnanode geofiles if present
              for T in /opt/remnanode /opt/remnawave/node; do
                if [ -d "$T" ]; then
                  curl -fsSL -o "$T/geoip.dat" "https://github.com/${{ github.repository }}/releases/latest/download/geoip.dat" || true
                  curl -fsSL -o "$T/geosite.dat" "https://github.com/${{ github.repository }}/releases/latest/download/geosite.dat" || true
                  chmod 777 "$T"/*.dat 2>/dev/null || true
                  (cd "$T" && docker compose restart 2>/dev/null || true)
                fi
              done
          REMOTE_SCRIPT
          done
          rm -f ~/.ssh/deploy_key
