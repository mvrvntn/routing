name: Build & Update Routing

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "geoip/**"
      - "HAPP/**"
      - "INCY/**"
      - "MIHOMO/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/update-configs.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Geodata & Routing Configs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CURL: "curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused"
      DEPLOY_SERVERS: ${{ secrets.DEPLOY_SERVERS }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Generate build tag
        run: |
          DAILY_TAG=$(date -u +%Y%m%d%H%M)
          echo "DAILY_TAG=$DAILY_TAG" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Unit Tests & Regression Verification
        run: |
          set -euo pipefail
          python3 -m unittest discover tests -v

      - name: Run Smart Ingestion & Sanitization for Geoblocked Domains
        run: |
          set -euo pipefail
          python3 scripts/update_geoblock.py

      # --- 1. BUILD GEOSITE.DAT ---
      - name: Checkout geosite builder
        uses: actions/checkout@v4
        with:
          repository: v2fly/domain-list-community
          path: community
          fetch-depth: 1

      - name: Build geosite.dat
        run: |
          set -euo pipefail
          rm -rf community/data /tmp/geosite_out
          mkdir -p community/data /tmp/geosite_out

          cp -a ./data/. community/data/

          pushd community >/dev/null
          go run ./ -outputdir=/tmp/geosite_out
          popd >/dev/null

          test -s /tmp/geosite_out/dlc.dat
          cp -f /tmp/geosite_out/dlc.dat ./geosite.dat

      - name: Validate geosite.dat (Smoke Test & Content Verification)
        run: |
          set -euo pipefail
          test -s ./geosite.dat
          SIZE=$(wc -c < ./geosite.dat)
          echo "geosite.dat size: $SIZE bytes"
          if [ "$SIZE" -lt 65000 ] || [ "$SIZE" -gt 350000 ]; then
            echo "Error: geosite.dat size ($SIZE bytes) outside expected safe range [65KB, 350KB]!"
            exit 1
          fi

          python3 - <<'PY'
          import glob, os, sys, re

          def varint(buf, i):
              result = shift = 0
              while True:
                  b = buf[i]; i += 1
                  result |= (b & 0x7F) << shift
                  if not (b & 0x80):
                      return result, i
                  shift += 7

          def fields(buf):
              i, out = 0, []
              while i < len(buf):
                  key, i = varint(buf, i)
                  fn, wt = key >> 3, key & 7
                  if wt == 0:   val, i = varint(buf, i)
                  elif wt == 1: val, i = buf[i:i+8], i+8
                  elif wt == 2:
                      ln, i = varint(buf, i); val, i = buf[i:i+ln], i+ln
                  elif wt == 5: val, i = buf[i:i+4], i+4
                  else: raise ValueError(f"bad wire type {wt}")
                  out.append((fn, wt, val))
              return out

          def parse_geosite(path):
              data = open(path, "rb").read()
              catalog = {}
              for fn, wt, payload in fields(data):
                  if fn != 1 or wt != 2: continue
                  code, values = None, set()
                  for f2, w2, v2 in fields(payload):
                      if f2 == 1 and w2 == 2: code = v2.decode()
                      elif f2 == 2 and w2 == 2:
                          for f3, w3, v3 in fields(v2):
                              if f3 == 2 and w3 == 2:
                                  values.add(v3.decode().lower())
                  if code: catalog[code.upper()] = values
              return catalog

          def resolve(name, stack=()):
              if name in stack: return set()
              path = os.path.join("data", name)
              if not os.path.exists(path): return set()
              out = set()
              for line in open(path, encoding="utf-8", errors="ignore"):
                  line = line.strip()
                  if not line or line.startswith("#"): continue
                  if line.startswith("include:"):
                      out |= resolve(line.split(":", 1)[1].strip(), stack + (name,))
                      continue
                  line = re.sub(r"^(domain|full|keyword|regexp):", "", line)
                  line = line.strip(". ").lower()
                  if line: out.add(line)
              return out

          def is_covered(domain, catalog_set):
              if domain in catalog_set:
                  return True
              parts = domain.split(".")
              for i in range(1, len(parts)):
                  if ".".join(parts[i:]) in catalog_set:
                      return True
              return False

          catalog = parse_geosite("geosite.dat")
          failures = []
          for path in sorted(glob.glob("data/*")):
              name = os.path.basename(path).upper()
              src = resolve(os.path.basename(path))
              got = catalog.get(name)
              if got is None:
                  failures.append(f"{name}: category missing from geosite.dat")
                  continue
              missing = [d for d in src if not is_covered(d, got)]
              if missing:
                  failures.append(
                      f"{name}: {len(missing)}/{len(src)} source values missing "
                      f"(e.g. {sorted(missing)[:5]})"
                  )

          for code in sorted(catalog):
              print(f"  {code}: {len(catalog[code])} entries")

          if failures:
              print("❌ geosite.dat is out of sync with data/:")
              for f in failures: print("  -", f)
              sys.exit(1)
          print("✅ geosite.dat fully covers data/")
          PY
          echo "geosite.dat Smoke Test & Content Verification PASSED."

      # --- 2. BUILD GEOIP.DAT ---
      - name: Checkout geoip builder
        uses: actions/checkout@v4
        with:
          repository: Loyalsoldier/geoip
          path: geoip_src
          fetch-depth: 1

      - name: Overlay custom files over geoip
        run: |
          set -euo pipefail
          cp -f ./geoip/*.json geoip_src/ 2>/dev/null || true
          cp -f ./geoip/*.txt  geoip_src/ 2>/dev/null || true
          cp -f ./geoip/*.py   geoip_src/ 2>/dev/null || true

      - name: Download IP lists and Geobases
        working-directory: geoip_src
        run: |
          set -euo pipefail
          mkdir -p geolite2

          ${{ env.CURL }} -o whitelist.txt https://raw.githubusercontent.com/escapingworm/russia-whitelist/refs/heads/main/ru-whitelist-cidr.txt || touch whitelist.txt
          ${{ env.CURL }} -o antifilterdownloadcommunity.txt https://community.antifilter.download/list/community.lst || touch antifilterdownloadcommunity.txt
          ${{ env.CURL }} -o refilter.txt https://raw.githubusercontent.com/1andrevich/Re-filter-lists/refs/heads/main/ipsum.lst || touch refilter.txt
          ${{ env.CURL }} -o refiltercommunity.txt https://raw.githubusercontent.com/1andrevich/Re-filter-lists/refs/heads/main/community_ips.lst || touch refiltercommunity.txt
          ${{ env.CURL }} -o antifilternetwork.txt https://antifilter.network/download/ip.lst || touch antifilternetwork.txt
          ${{ env.CURL }} -o cdn.lst https://raw.githubusercontent.com/mansourjabin/cdn-ip-database/refs/heads/main/data/cdn.lst || touch cdn.lst
          ${{ env.CURL }} -o merged.sum https://raw.githubusercontent.com/PentiumB/CDN-RuleSet/refs/heads/main/release/merged.sum || touch merged.sum

          ${{ env.CURL }} -o geolite_ru.lst https://raw.githubusercontent.com/hydraponique/countrydb/refs/heads/main/output/geolite2-geo-whois-asn-country-ipv4/ru.lst || touch geolite_ru.lst
          ${{ env.CURL }} -o geolite_by.lst https://raw.githubusercontent.com/hydraponique/countrydb/refs/heads/main/output/geolite2-geo-whois-asn-country-ipv4/by.lst || touch geolite_by.lst
          ${{ env.CURL }} -o ipinfo_ru.lst https://raw.githubusercontent.com/Davoyan/ipinfo/refs/heads/main/geo/geoip/ru.lst || touch ipinfo_ru.lst
          ${{ env.CURL }} -o ipinfo_by.lst https://raw.githubusercontent.com/Davoyan/ipinfo/refs/heads/main/geo/geoip/by.lst || touch ipinfo_by.lst
          ${{ env.CURL }} -o dbip_ru.lst https://raw.githubusercontent.com/hydraponique/countrydb/refs/heads/main/output/dbip-country-ipv4/ru.lst || touch dbip_ru.lst
          ${{ env.CURL }} -o dbip_by.lst https://raw.githubusercontent.com/hydraponique/countrydb/refs/heads/main/output/dbip-country-ipv4/by.lst || touch dbip_by.lst

          ${{ env.CURL }} -o /tmp/GeoLite2-ASN-CSV.zip https://dl.netsyms.net/dbs/geolite2/GeoLite2-ASN-CSV.zip || true
          if [ -f /tmp/GeoLite2-ASN-CSV.zip ]; then
            unzip -o -j /tmp/GeoLite2-ASN-CSV.zip '*/GeoLite2-ASN-Blocks-*.csv' -d ./geolite2 || true
          fi

      - name: Build geoip.dat
        working-directory: geoip_src
        run: |
          set -euo pipefail
          go mod download
          go build -o geoip_builder
          rm -rf output
          ./geoip_builder convert -c config.json
          test -s output/dat/geoip.dat
          cp -f output/dat/geoip.dat ../geoip.dat

      - name: Validate geoip.dat (Smoke Test & Content Verification)
        run: |
          set -euo pipefail
          test -s ./geoip.dat
          SIZE=$(wc -c < ./geoip.dat)
          echo "geoip.dat size: $SIZE bytes"
          if [ "$SIZE" -lt 300000 ] || [ "$SIZE" -gt 2500000 ]; then
            echo "Error: geoip.dat size ($SIZE bytes) outside expected safe range [300KB, 2.5MB]!"
            exit 1
          fi

          python3 - <<'PY'
          import ipaddress, os, sys

          def varint(buf, i):
              result = shift = 0
              while True:
                  b = buf[i]; i += 1
                  result |= (b & 0x7F) << shift
                  if not (b & 0x80):
                      return result, i
                  shift += 7

          def fields(buf):
              i, out = 0, []
              while i < len(buf):
                  key, i = varint(buf, i)
                  fn, wt = key >> 3, key & 7
                  if wt == 0:   val, i = varint(buf, i)
                  elif wt == 1: val, i = buf[i:i+8], i+8
                  elif wt == 2:
                      ln, i = varint(buf, i); val, i = buf[i:i+ln], i+ln
                  elif wt == 5: val, i = buf[i:i+4], i+4
                  else: raise ValueError(f"bad wire type {wt}")
                  out.append((fn, wt, val))
              return out

          def parse_geoip(path):
              catalog = {}
              for fn, wt, payload in fields(open(path, "rb").read()):
                  if fn != 1 or wt != 2: continue
                  code, nets = None, []
                  for f2, w2, v2 in fields(payload):
                      if f2 == 1 and w2 == 2:
                          code = v2.decode()
                      elif f2 == 2 and w2 == 2:
                          ip_bytes, prefix = None, None
                          for f3, w3, v3 in fields(v2):
                              if f3 == 1 and w3 == 2: ip_bytes = v3
                              elif f3 == 2 and w3 == 0: prefix = v3
                          if ip_bytes is not None and prefix is not None:
                              nets.append(ipaddress.ip_network(
                                  (ipaddress.ip_address(ip_bytes), prefix), strict=False))
                  if code: catalog[code.upper()] = nets
              return catalog

          def read_cidrs(path):
              out = []
              if not os.path.exists(path): return out
              for line in open(path, encoding="utf-8", errors="ignore"):
                  line = line.strip()
                  if not line or line.startswith("#"): continue
                  try: out.append(ipaddress.ip_network(line, strict=False))
                  except ValueError: pass
              return out

          catalog = parse_geoip("geoip.dat")
          targets = {
              "geoip/discord.txt": ("DISCORD", "geoip/discord.txt"),
              "geoip/telegram.txt": ("TELEGRAM", "geoip/telegram.txt"),
              "geoip/CUSTOM-FIX-ADD.txt": ("DIRECT", "geoip/CUSTOM-FIX-ADD.txt"),
              "geoip/CUSTOM-LIST-ADD.txt": ("DIRECT", "geoip/CUSTOM-LIST-ADD.txt"),
              "geoip/CUSTOM-WHITELIST.txt": ("WHITELIST", "geoip/CUSTOM-WHITELIST.txt"),
          }

          failures = []
          for key, (code, path) in targets.items():
              nets = catalog.get(code, [])
              net_set = set(nets)
              v4_nets = [n for n in nets if n.version == 4]
              v6_nets = [n for n in nets if n.version == 6]
              src_nets = read_cidrs(path)
              missing = []
              for net in src_nets:
                  if net in net_set:
                      continue
                  pool = v4_nets if net.version == 4 else v6_nets
                  if not any(net.subnet_of(n) for n in pool):
                      missing.append(str(net))
              if missing:
                  failures.append(f"{path} -> {code}: {len(missing)} CIDR not covered (e.g. {missing[:5]})")

          for code in sorted(catalog):
              print(f"  {code}: {len(catalog[code])} CIDRs")

          if failures:
              print("❌ geoip.dat is out of sync with geoip/ sources:")
              for f in failures: print("  -", f)
              sys.exit(1)
          print("✅ geoip.dat fully covers geoip/ sources")
          PY
          echo "geoip.dat Smoke Test & Content Verification PASSED."

      # --- 3. CONVERT RULESETS (MIHOMO & SING-BOX) ---
      - name: Install Mihomo & sing-box
        run: |
          set -euo pipefail
          ARCH=$(dpkg --print-architecture)
          LATEST_URL=$(${{ env.CURL }} -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | grep -oP '"browser_download_url":\s*"\K[^"]*mihomo-linux-'"$ARCH"'-[^"]*\.deb(?=")' \
            | head -n1 || true)
          if [ -n "$LATEST_URL" ]; then
            ${{ env.CURL }} -o /tmp/mihomo.deb "$LATEST_URL"
            sudo dpkg -i /tmp/mihomo.deb || sudo apt-get install -f -y
            rm -f /tmp/mihomo.deb
          fi

          ${{ env.CURL }} https://sing-box.app/install.sh | sudo -E sh -s -- --version 1.12.12 || true

      - name: Build .mrs & .srs
        run: |
          set -euo pipefail
          mkdir -p /tmp/data_expanded /tmp/mihomo_rules /tmp/singbox_rules

          # Preprocess data files to expand include: directives recursively
          python3 -c '
          import os, glob

          def resolve_file(fname, visited=None):
              if visited is None: visited = set()
              if fname in visited: return []
              visited.add(fname)
              fpath = os.path.join("data", fname)
              if not os.path.exists(fpath): return []
              lines = []
              with open(fpath, "r", encoding="utf-8") as f:
                  for l in f:
                      l = l.strip()
                      if not l or l.startswith("#"): continue
                      if l.startswith("include:"):
                          inc_target = l.split(":")[1].strip()
                          lines.extend(resolve_file(inc_target, visited.copy()))
                      else:
                          lines.append(l)
              return lines

          for p in glob.glob("data/*"):
              name = os.path.basename(p)
              resolved = resolve_file(name)
              with open(os.path.join("/tmp/data_expanded", name), "w", encoding="utf-8") as out:
                  out.write("\n".join(resolved) + "\n")
          '

          if command -v mihomo &>/dev/null; then
            for f in /tmp/data_expanded/*; do
              [ -f "$f" ] || continue
              name=$(basename "$f")
              tmp="$(mktemp)"
              awk '
                function trim(s){ sub(/^[ \t]+/,"",s); sub(/[ \t]+$/,"",s); return s }
                {
                  gsub(/\r/,"")
                  s=trim($0)
                  sub(/[ \t]*#.*/, "", s)
                  if (s ~ /^full:/) { sub(/^full:/, "", s); if (s != "") print s; next }
                  if (s ~ /^domain:/) { sub(/^domain:/, "", s); sub(/^\./, "", s); if (s != "") print "+." s; next }
                  if (s ~ /^keyword:/) { sub(/^keyword:/, "", s); sub(/^\./, "", s); if (s != "") print "+." s ".*"; next }
                  if (s != "" && s !~ /^[a-z0-9_-]+:/) { sub(/^\./, "", s); print "+." s }
                }
              ' "$f" > "$tmp"
              mihomo convert-ruleset domain text "$tmp" "/tmp/mihomo_rules/${name}.mrs" 2>/dev/null || true
              rm -f "$tmp"
            done
          fi

          if command -v sing-box &>/dev/null; then
            for f in /tmp/data_expanded/*; do
              [ -f "$f" ] || continue
              name=$(basename "$f")
              tmp_json="$(mktemp)"
              awk '
                function trim(s){ sub(/^[ \t]+/,"",s); sub(/[ \t]+$/,"",s); return s }
                {
                  gsub(/\r/,"")
                  s=trim($0)
                  sub(/[ \t]*#.*/, "", s)
                  if (s ~ /^full:/)   { v=trim(substr(s,6)); sub(/^\./,"",v); if(v!="") print "domain\t"  v; next }
                  if (s ~ /^domain:/) { v=trim(substr(s,8)); sub(/^\./,"",v); if(v!="") print "suffix\t"  v; next }
                  if (s ~ /^keyword:/){ v=trim(substr(s,9));                   if(v!="") print "keyword\t" v; next }
                  if (s ~ /^regexp:/) { v=trim(substr(s,8));                   if(v!="") print "regex\t"   v; next }
                  if (s != "" && s !~ /^[a-z0-9_-]+:/) { sub(/^\./,"",s); print "suffix\t" s }
                }
              ' "$f" | jq -Rn '
                def add($k; $v): .rules[0][$k] = ((.rules[0][$k] // []) + [$v]);
                reduce (inputs | split("\t")) as $it ({"version":3,"rules":[{}]};
                  if   $it[0]=="domain"  then add("domain";         $it[1])
                  elif $it[0]=="suffix"  then add("domain_suffix";  $it[1])
                  elif $it[0]=="keyword" then add("domain_keyword"; $it[1])
                  elif $it[0]=="regex"   then add("domain_regex";   $it[1])
                  else . end
                )
                | .rules[0] |= with_entries(select(.value | length > 0))
                | if (.rules[0] | length) == 0 then .rules = [] else . end
              ' > "$tmp_json"
              sing-box rule-set compile --output "/tmp/singbox_rules/${name}.srs" "$tmp_json" 2>/dev/null || true
              rm -f "$tmp_json"
            done
          fi

      # --- 4. PREPARE RELEASE DIR & PACKAGES ---
      - name: Prepare release files
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/mihomo release/sing-box release/text

          cp -f geosite.dat release/
          cp -f geoip.dat release/
          sha256sum release/geosite.dat | awk '{print $1}' > release/geosite.dat.sha256
          sha256sum release/geoip.dat | awk '{print $1}' > release/geoip.dat.sha256

          if [ -d /tmp/mihomo_rules ]; then
            cp -a /tmp/mihomo_rules/. release/mihomo/ 2>/dev/null || true
            cp -f MIHOMO/games.yaml release/mihomo/ 2>/dev/null || true
            cp -f MIHOMO/ru-apps.yaml release/mihomo/ 2>/dev/null || true
            cp -f MIHOMO/torrent-clients.yaml release/mihomo/ 2>/dev/null || true
            if [ -d geoip_src/output/mrs ]; then
              for rule in discord telegram whitelist private; do
                if [ -f "geoip_src/output/mrs/${rule}.mrs" ]; then
                  mv "geoip_src/output/mrs/${rule}.mrs" "geoip_src/output/mrs/${rule}-ip.mrs"
                fi
              done
              cp -a geoip_src/output/mrs/. release/mihomo/ 2>/dev/null || true
            fi
            tar -czf release/mihomo.tar.gz -C release mihomo
          fi

          if [ -d /tmp/singbox_rules ]; then
            cp -a /tmp/singbox_rules/. release/sing-box/ 2>/dev/null || true
            if [ -d geoip_src/output/srs ]; then
              for rule in discord telegram whitelist private; do
                if [ -f "geoip_src/output/srs/${rule}.srs" ]; then
                  mv "geoip_src/output/srs/${rule}.srs" "geoip_src/output/srs/${rule}-ip.srs"
                fi
              done
              cp -a geoip_src/output/srs/. release/sing-box/ 2>/dev/null || true
            fi
            tar -czf release/sing-box.tar.gz -C release sing-box
          fi

          if [ -d geoip_src/output/text ]; then
            for rule in discord telegram whitelist private; do
              if [ -f "geoip_src/output/text/${rule}.txt" ]; then
                mv "geoip_src/output/text/${rule}.txt" "geoip_src/output/text/${rule}-ip.txt"
              fi
            done
            cp -a geoip_src/output/text/. release/text/ 2>/dev/null || true
            tar -czf release/text.tar.gz -C release text
          fi

      # --- 5. UPDATE HAPP & INCY MANIFESTS ---
      - name: Update HAPP and INCY manifests & Deeplinks
        run: |
          set -euo pipefail
          now_epoch="$(date -u +%s)"
          geoip_url="https://cdn.jsdelivr.net/gh/${{ github.repository }}@release/geoip.dat"
          geosite_url="https://cdn.jsdelivr.net/gh/${{ github.repository }}@release/geosite.dat"

          update_json_and_deeplink() {
            local folder="$1"
            local name="$2"
            local json_file="${folder}/${name}.JSON"
            local deeplink_file="${folder}/${name}.DEEPLINK"
            local scheme="$(echo "$folder" | tr '[:upper:]' '[:lower:]')"

            local tmp="$(mktemp)"
            jq \
              --arg ts "$now_epoch" \
              --arg geoip "$geoip_url" \
              --arg geosite "$geosite_url" \
              '.LastUpdated = $ts | .Geoipurl = $geoip | .Geositeurl = $geosite' \
              "$json_file" > "$tmp"
            mv "$tmp" "$json_file"

            local b64="$(jq -c . "$json_file" | base64 -w 0)"
            printf '%s://routing/onadd/%s\n' "$scheme" "$b64" > "$deeplink_file"

            if [ "$folder" = "INCY" ]; then
              local autorouting_file="${folder}/${name}.AUTOROUTING"
              printf 'incy://autorouting/onadd/https://cdn.jsdelivr.net/gh/%s@main/INCY/%s.JSON\n' "${{ github.repository }}" "$name" > "$autorouting_file"
            fi
          }

          update_json_and_deeplink "HAPP" "DEFAULT"
          update_json_and_deeplink "HAPP" "WHITELIST"
          update_json_and_deeplink "HAPP" "JSONSUB"

          update_json_and_deeplink "INCY" "DEFAULT"
          update_json_and_deeplink "INCY" "WHITELIST"
          update_json_and_deeplink "INCY" "JSONSUB"

          # Update RELOCANT manifests
          update_relocant_client() {
            local client="$1"
            local json_file="RELOCANT/${client}.JSON"
            local deeplink_file="RELOCANT/${client}.DEEPLINK"
            local scheme="$(echo "$client" | tr '[:upper:]' '[:lower:]')"

            local tmp="$(mktemp)"
            jq \
              --arg ts "$now_epoch" \
              --arg geoip "$geoip_url" \
              --arg geosite "$geosite_url" \
              '.LastUpdated = $ts | .Geoipurl = $geoip | .Geositeurl = $geosite' \
              "$json_file" > "$tmp"
            mv "$tmp" "$json_file"

            local b64="$(jq -c . "$json_file" | base64 -w 0)"
            printf '%s://routing/onadd/%s\n' "$scheme" "$b64" > "$deeplink_file"

            if [ "$client" = "INCY" ]; then
              local autorouting_file="RELOCANT/INCY.AUTOROUTING"
              printf 'incy://autorouting/onadd/https://cdn.jsdelivr.net/gh/%s@main/RELOCANT/INCY.JSON\n' "${{ github.repository }}" > "$autorouting_file"
            fi
          }

          update_relocant_client "HAPP"
          update_relocant_client "INCY"

      # --- 6. PUSH RELEASE BRANCH & PUBLISH GITHUB RELEASE ---
      - name: Push to release branch
        run: |
          set -euo pipefail
          cd release
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add -A
          git commit -m "Релиз ${{ env.DAILY_TAG }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u origin release
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.DAILY_TAG }}
          name: "Релиз роутинга ${{ env.DAILY_TAG }}"
          prerelease: false
          draft: false
          files: |
            release/*.dat
            release/*.dat.sha256
            release/*.tar.gz

      # --- 7. COMMIT UPDATED MANIFESTS TO MAIN ---
      - name: Commit and push changes to main
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HAPP/ INCY/ RELOCANT/ README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: обновление конфигураций роутинга и диплинков ${{ env.DAILY_TAG }} [skip ci]"
            git push origin main
          fi

      # --- 8. PURGE CDN CACHE ---
      - name: Purge jsDelivr CDN
        run: |
          set -euo pipefail
          for file in geosite.dat geoip.dat geosite.dat.sha256 geoip.dat.sha256 \
                      mihomo/discord-ip.mrs mihomo/telegram-ip.mrs mihomo/whitelist-ip.mrs mihomo/private-ip.mrs \
                      mihomo/games.yaml mihomo/ru-apps.yaml mihomo/torrent-clients.yaml \
                      sing-box/discord-ip.srs sing-box/telegram-ip.srs sing-box/whitelist-ip.srs sing-box/private-ip.srs; do
            ${{ env.CURL }} -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/${file}" || true
          done
          for json in INCY/DEFAULT.JSON INCY/WHITELIST.JSON INCY/JSONSUB.JSON RELOCANT/INCY.JSON \
                      INCY/DEFAULT.AUTOROUTING INCY/WHITELIST.AUTOROUTING INCY/JSONSUB.AUTOROUTING RELOCANT/INCY.AUTOROUTING \
                      HAPP/DEFAULT.JSON HAPP/WHITELIST.JSON HAPP/JSONSUB.JSON RELOCANT/HAPP.JSON; do
            ${{ env.CURL }} -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/${json}" || true
          done

      # --- 9. OPTIONAL DEPLOY TO SERVERS ---
      - name: Deploy to servers (if configured)
        if: env.DEPLOY_SERVERS != '' && env.DEPLOY_SSH_KEY != ''
        run: |
          set -euo pipefail
          HAPP_DEFAULT="$(tr -d '\n\r' < HAPP/DEFAULT.DEEPLINK)"
          INCY_DEFAULT="$(tr -d '\n\r' < INCY/DEFAULT.DEEPLINK)"

          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/deploy_key"

          IFS=',' read -ra SERVERS <<< "$DEPLOY_SERVERS"
          for SERVER in "${SERVERS[@]}"; do
            SRV=$(echo "$SERVER" | xargs)
            [ -n "$SRV" ] || continue
            echo "Updating node on $SRV..."
            ssh $SSH_OPTS "$SRV" bash -s -- "$HAPP_DEFAULT" "$INCY_DEFAULT" <<'REMOTE_SCRIPT' || true
              set -e
              # Update remnanode geofiles if present
              for T in /opt/remnanode /opt/remnawave/node; do
                if [ -d "$T" ]; then
                  curl -fsSL --retry 3 -o "$T/geoip.dat" "https://cdn.jsdelivr.net/gh/${{ github.repository }}@release/geoip.dat" || \
                  curl -fsSL --retry 3 -o "$T/geoip.dat" "https://raw.githubusercontent.com/${{ github.repository }}/release/geoip.dat" || true
                  
                  curl -fsSL --retry 3 -o "$T/geosite.dat" "https://cdn.jsdelivr.net/gh/${{ github.repository }}@release/geosite.dat" || \
                  curl -fsSL --retry 3 -o "$T/geosite.dat" "https://raw.githubusercontent.com/${{ github.repository }}/release/geosite.dat" || true
                  
                  chmod 644 "$T"/*.dat 2>/dev/null || true
                  (cd "$T" && (docker compose restart || docker-compose restart) 2>/dev/null || true)
                fi
              done
          REMOTE_SCRIPT
          done
          rm -f ~/.ssh/deploy_key
