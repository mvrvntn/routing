name: Validate & Lint Routing Configs

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "geoip/**"
      - "HAPP/**"
      - "INCY/**"
      - "MIHOMO/**"
      - "RELOCANT/**"
      - "SHADOWROCKET/**"
      - "ADDON_AUTOROUTING/**"
      - "tools/**"
      - "tests/**"
      - ".github/**"

jobs:
  validate:
    name: Validate JSON, YAML, Geodata & Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install pyyaml requests

      - name: Run Integrity & Syntax Test
        run: |
          python3 -c "
          import glob, json, yaml, sys
          if hasattr(sys.stdout, 'reconfigure'):
              sys.stdout.reconfigure(encoding='utf-8')

          errors = []

          # 1. Validate JSON
          json_files = (
              glob.glob('HAPP/*.JSON') +
              glob.glob('INCY/*.JSON') +
              glob.glob('RELOCANT/*.JSON') +
              glob.glob('ADDON_AUTOROUTING/**/*.json', recursive=True) +
              glob.glob('geoip/*.json')
          )
          for p in json_files:
              try:
                  with open(p, 'r', encoding='utf-8') as f:
                      json.load(f)
              except Exception as e:
                  errors.append(f'JSON error in {p}: {e}')

          # 2. Validate YAML
          yaml_files = (
              glob.glob('MIHOMO/*.yaml') +
              glob.glob('RELOCANT/*.yaml') +
              glob.glob('.github/**/*.yml', recursive=True)
          )
          for p in yaml_files:
              try:
                  with open(p, 'r', encoding='utf-8') as f:
                      yaml.safe_load(f)
              except Exception as e:
                  errors.append(f'YAML error in {p}: {e}')

          # 3. Validate data domain lists
          for p in glob.glob('data/*'):
              try:
                  with open(p, 'r', encoding='utf-8') as f:
                      lines = [l.strip() for l in f if l.strip() and not l.strip().startswith('#')]
                      if len(lines) == 0:
                          errors.append(f'Data list empty: {p}')
              except Exception as e:
                  errors.append(f'Data file read error in {p}: {e}')

          if errors:
              print(f'❌ Validation failed with {len(errors)} errors:')
              for err in errors:
                  print(' -', err)
              sys.exit(1)
          else:
              print('✅ ALL ROUTING, JSON, YAML, AND DOMAIN DATA FILES PASSED VALIDATION PERFECTLY!')
          "

      - name: Run Test Suite
        run: python -m unittest discover tests -v
