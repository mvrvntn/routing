name: Запрос на добавление или изменение домена
description: Предложить добавить или перенаправить домен (Direct, Proxy, Whitelist, Relocant)
title: "[Маршрут]: <домен или название сервиса>"
labels: ["domains", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ### Добавление или корректировка маршрута
        Перед созданием заявки проверьте через поиск по репозиторию, нет ли уже нужного домена в списках `data/`.
  - type: input
    id: domain
    attributes:
      label: Домен или FQDN
      description: Укажите точный домен или корневую маску (без https://, портов и путей).
      placeholder: example.com
    validations:
      required: true
  - type: dropdown
    id: action
    attributes:
      label: Желаемый маршрут (Действие)
      description: Каким образом должен обрабатываться этот ресурс?
      options:
        - "DIRECT (Напрямую): Сервисы РФ, банки, Госуслуги, игры, доставка"
        - "PROXY (Через прокси): Зарубежные платформы, AI, сервисы с геоблокировкой"
        - "WHITELIST (Белый список БС): Критическая инфраструктура РФ"
        - "RELOCANT (Релокант): Для проживающих за пределами РФ (обратный сплит)"
        - "BLOCK (Блокировка): Трекеры, спам, телеметрия"
    validations:
      required: true
  - type: dropdown
    id: category_type
    attributes:
      label: Тип сервиса
      options:
        - "Банки / Платежи / Финансы"
        - "Государственные / Муниципальные порталы"
        - "Медиаплатформы / Видео / Музыка"
        - "Нейросети / AI-инструменты"
        - "Игры / Игровые платформы"
        - "Маркетплейсы / Доставка / Екоммерс"
        - "Работа / Образование / Облачные сервисы"
        - "Реклама / Трекеры / Телеметрия"
        - "Другое"
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Причина / Симптом проблемы
      description: Какая ошибка возникает? Если известны связанные API-хосты или IP-адреса — укажите их.
      placeholder: "Пример: При прямом доступе из РФ отдаёт ошибку соединения (или 403). Связанный API: api.service.com"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Проверка перед отправкой
      options:
        - label: Домен указан без протокола (без `https://`) и без путей (без `/page`)
          required: true
        - label: Проверено фактическое поведение сервиса (напрямую и через узел)
          required: true
        - label: Проверен поиск по репозиторию — домен отсутствует в списках `data/` или работает некорректно
          required: true
